
name: Java Selenium Automation CI-CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Selenium TestNG Suite
        run: mvn -B test -Dsurefire.suiteXmlFiles=testng.xml -Dheadless=true

      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: |
            target/surefire-reports/
            test-output/
            src/test/resources/ScreenShot/
            src/test/resources/ExtentReport/
          if-no-files-found: ignore

      # Checkout gh-pages to use it as historical report storage
      - name: Checkout report history branch
        id: history_checkout
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      # Save this execution and regenerate the report history page
      - name: Archive Extent Report
        id: archive_report
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && steps.history_checkout.outcome == 'success'
        run: |
          REPORT="src/test/resources/ExtentReport/ExtentReport.html"
          RUN_FOLDER="run-${GITHUB_RUN_NUMBER}-attempt-${GITHUB_RUN_ATTEMPT}"

          mkdir -p "site/reports/history"

          if [ -f "$REPORT" ]; then
            mkdir -p "site/reports/history/$RUN_FOLDER"
            cp "$REPORT" "site/reports/history/$RUN_FOLDER/index.html"
            cp "$REPORT" "site/latest.html"
            echo "Archived report: $RUN_FOLDER"
          else
            echo "::warning::Extent Report was not generated."
          fi

          {
            echo '<!DOCTYPE html>'
            echo '<html><head><meta charset="UTF-8">'
            echo '<title>Selenium Automation Reports</title>'
            echo '</head><body>'
            echo '<h1>Selenium Automation Reports</h1>'

            if [ -f site/latest.html ]; then
              echo '<h2><a href="latest.html">View Latest Extent Report</a></h2>'
            fi

            echo '<h2>Historical Test Executions</h2>'
            echo '<ul>'

            if [ -d site/reports/history ]; then
              while IFS= read -r report; do
                folder=$(basename "$(dirname "$report")")
                relative_path="${report#site/}"
                printf '<li><a href="%s">%s</a></li>\n' "$relative_path" "$folder"
              done < <(find site/reports/history -mindepth 2 -maxdepth 2 -name index.html | sort -Vr)
            fi

            echo '</ul></body></html>'
          } > site/index.html

          touch site/.nojekyll

          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site add --all

          if ! git -C site diff --cached --quiet; then
            git -C site commit -m "Archive Selenium report ${RUN_FOLDER}"
            git -C site push origin HEAD:gh-pages
          fi

      - name: Configure GitHub Pages
        if: always() && steps.archive_report.outcome == 'success'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: always() && steps.archive_report.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: always() && steps.archive_report.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@v4
