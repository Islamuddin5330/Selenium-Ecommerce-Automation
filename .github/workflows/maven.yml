
name: Java Selenium Automation CI-CD

on:
  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Selenium TestNG Suite
        run: mvn -B test -Dsurefire.suiteXmlFiles=testng.xml -Dheadless=true

      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: |
            target/surefire-reports/
            test-output/
            src/test/resources/ScreenShot/
            src/test/resources/ExtentReport/
          if-no-files-found: ignore

      # Prepare Extent Report for GitHub Pages
      - name: Prepare Extent Report
        run: |
          mkdir -p site
          test -f src/test/resources/ExtentReport/ExtentReport.html
          cp src/test/resources/ExtentReport/ExtentReport.html site/index.html

      # Configure GitHub Pages
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      # Upload report for deployment
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Deploy report
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
